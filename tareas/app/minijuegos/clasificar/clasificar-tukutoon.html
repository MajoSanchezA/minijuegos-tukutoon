<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TukuToon · Clasificar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comfortaa:wght@400;700&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="motor/motor-clasificar.css">
</head>
<body>

<script src="clasificar.js"></script>
<script src="motor/motor-clasificar.js"></script>
<script>
  // Que ronda mostrar sale de la URL, mismo criterio que ?vocal= y
  // ?ronda= en los otros dos juegos: con ?ronda=tres la app entra derecho
  // a esa ronda sola y el selector de abajo desaparece.
  var pedida = (location.search.match(/[?&]ronda=([a-z-]+)/) || [])[1];

  TukuToonSortPage({
    rondas: CLASIFICAR_RONDAS,
    colores: CLASIFICAR_COLORES,
    ronda: pedida || null,
    titulo: 'TukuToon',
    subtitulo: 'CLASIFICAR',
    // Aida acompana desde el lado izquierdo del escenario.
    mascota: { src:'../../comunidad/assets/personajes/aida-2.png', alt:'Aida' }
    // menuHref: 'menu.html'   // cuando este el menu del juego
  });
</script>

</body>
</html>
