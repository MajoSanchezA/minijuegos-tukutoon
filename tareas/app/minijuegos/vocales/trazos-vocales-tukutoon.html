<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TukuToon · Traza las vocales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comfortaa:wght@400;700&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  /* 100dvh, nunca 100vh: el chrome dinamico del navegador movil corta la pantalla */
  height:100vh; height:100dvh;
  font-family:'Comfortaa',system-ui,-apple-system,sans-serif;
  color:#2B2140;
  background:linear-gradient(180deg,#6E4FD0 0%,#9B7BE8 48%,#CDBBF7 100%);
  overflow:hidden;
  touch-action:none;
  display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
}

/* ---------- nubes de fondo ---------- */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;background:rgba(255,255,255,.55);border-radius:100px}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:100px}
.cloud::before{width:55%;height:150%;left:12%;top:-70%}
.cloud::after{width:40%;height:120%;right:14%;top:-50%}
.c1{width:150px;height:52px;top:12%;left:-30%;animation:drift 46s linear infinite}
.c2{width:105px;height:38px;top:34%;left:-30%;animation:drift 62s linear infinite 6s;opacity:.75}
.c3{width:190px;height:64px;top:62%;left:-40%;animation:drift 78s linear infinite 14s;opacity:.5}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(170vw)}}

/* ---------- header ---------- */
header{
  position:relative;z-index:2;flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:10px clamp(10px,3vw,22px) 4px;
}
.brand{
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(15px,4.2vw,22px);color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.14);
  white-space:nowrap;line-height:1.1;
}
.brand small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;
  font-size:.55em;opacity:.82;letter-spacing:.05em}
.stars{display:flex;gap:4px;margin-left:auto}
.star{width:clamp(20px,5.2vw,28px);height:clamp(20px,5.2vw,28px);display:block;
  transition:transform .35s cubic-bezier(.2,1.6,.5,1)}
.star path{fill:rgba(255,255,255,.28);stroke:rgba(255,255,255,.55);stroke-width:6;
  transition:fill .3s}
.star.on path{fill:#FFD84D;stroke:#fff}
.star.on{transform:scale(1.15)}
.icon-btn{
  flex:0 0 auto;width:clamp(34px,8.6vw,42px);height:clamp(34px,8.6vw,42px);
  border:none;border-radius:50%;background:rgba(255,255,255,.92);
  color:#6E4FD0;font-size:clamp(17px,4.6vw,21px);line-height:1;
  box-shadow:0 3px 0 rgba(0,0,0,.14);cursor:pointer;touch-action:manipulation;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}

/* ---------- consigna ---------- */
.prompt{
  position:relative;z-index:2;flex:0 0 auto;text-align:center;margin:0;
  font-family:'Fredoka',sans-serif;font-weight:500;color:#fff;
  font-size:clamp(13px,3.6vw,19px);padding:2px 16px 2px;
  text-shadow:0 2px 0 rgba(0,0,0,.12);
}

/* ---------- escenario ---------- */
main{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;
  align-items:center;justify-content:center;padding:4px 8px}
#stage{width:100%;height:100%;display:block;touch-action:none;overflow:visible}

.road-edge{fill:none;stroke:#fff;stroke-width:46;stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:#CFC9DD;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.road.done{stroke:#BFB8D2}
.dashes{fill:none;stroke:rgba(255,255,255,.95);stroke-width:3.2;stroke-linecap:round;
  stroke-dasharray:9 13}
.progress{fill:none;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.stroke-g{opacity:.34;transition:opacity .3s}
.stroke-g.active,.stroke-g.finished{opacity:1}

.face{pointer-events:none}
.face .eyes ellipse{fill:#2B2140}
.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.face .mouth{fill:none;stroke:#2B2140;stroke-width:3.4;stroke-linecap:round}
.face .cheek{fill:rgba(239,101,142,.45)}

.hand{pointer-events:none;font-size:44px;transition:opacity .2s}
.hand.hide{opacity:0}

/* ---------- selector de vocales ---------- */
footer{position:relative;z-index:2;flex:0 0 auto;display:flex;gap:clamp(6px,2.2vw,14px);
  justify-content:center;padding:6px clamp(8px,3vw,20px) max(10px,env(safe-area-inset-bottom))}
.vbtn{
  width:clamp(46px,13vw,68px);height:clamp(46px,13vw,68px);
  border:none;border-radius:22px;cursor:pointer;touch-action:manipulation;
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(22px,6.6vw,34px);color:#fff;
  background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.2);
  transition:transform .12s,box-shadow .12s;position:relative;
}
.vbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.vbtn.sel{outline:4px solid #fff;outline-offset:2px}
.vbtn.done::after{content:'⭐';position:absolute;top:-9px;right:-7px;font-size:.5em;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}

/* ---------- efectos y tarjeta ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#card{
  position:fixed;inset:0;z-index:6;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(43,33,64,.55);
}
#card.show{display:flex;animation:fade .28s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card-box{
  background:#FFFDF6;border-radius:28px;padding:clamp(16px,4.5vw,28px) clamp(20px,6vw,40px);
  text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.18);max-width:min(92vw,460px);
  animation:pop .42s cubic-bezier(.2,1.5,.45,1);
}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card-emoji{font-size:clamp(44px,14vw,76px);line-height:1.15}
.card-word{font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(26px,8vw,44px);margin:2px 0 4px}
.card-word b{color:var(--c)}
.card-hint{font-size:clamp(11px,3.2vw,14px);opacity:.55;margin-bottom:14px}
.card-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card-actions button{
  border:none;border-radius:18px;padding:11px 20px;cursor:pointer;touch-action:manipulation;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(14px,4vw,18px);color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
}
.card-actions button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn-again{background:#8D82A8}
.btn-next{background:var(--c)}

@media (prefers-reduced-motion:reduce){
  .cloud{animation:none !important}
  .face .eyes{animation:none}
  .card-box{animation:none}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
</div>

<header>
  <button class="icon-btn" id="reset-btn" title="Empezar esta vocal de nuevo" aria-label="Empezar de nuevo">↺</button>
  <div class="brand">TukuToon<small>TRAZA LAS VOCALES</small></div>
  <div class="stars" id="stars" aria-label="Vocales completadas"></div>
</header>

<p class="prompt" id="prompt">Seguí el camino con el dedo</p>

<main>
  <svg id="stage" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet"></svg>
</main>

<footer id="picker"></footer>

<canvas id="fx"></canvas>

<div id="card" role="dialog" aria-modal="true">
  <div class="card-box">
    <div class="card-emoji" id="card-emoji">🐝</div>
    <div class="card-word" id="card-word"></div>
    <div class="card-hint">Tocá para seguir jugando</div>
    <div class="card-actions">
      <button class="btn-again" id="btn-again">↺ Otra vez</button>
      <button class="btn-next" id="btn-next">Siguiente →</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   DATA — todo el contenido de las vocales vive acá.
   Para cambiar el arte (por ejemplo, redibujar los trazos en Figma sobre
   el arte oficial) solo se reemplaza el `d` de cada path: el codigo no
   cambia. viewBox de referencia: 0 0 300 400 (alto de mayuscula: y 60->340).
   El ORDEN de `strokes` es el orden de escritura correcto, y el sentido de
   cada path es la direccion en la que hay que trazarlo.
   ===================================================================== */
var VOWELS = [
  { letter:'A', color:'#FFC94A', emoji:'🐝', word:'Abeja',
    strokes:[
      'M150 60 L70 340',      // diagonal izquierda (de arriba hacia abajo)
      'M150 60 L230 340',     // diagonal derecha
      'M94 255 L206 255'      // barrita
    ],
    face:{x:150,y:172,s:.74} },

  { letter:'E', color:'#EF658E', emoji:'🐘', word:'Elefante',
    strokes:[
      'M80 60 L80 340',       // palito vertical
      'M80 60 L225 60',       // barra de arriba
      'M80 200 L205 200',     // barra del medio
      'M80 340 L225 340'      // barra de abajo
    ],
    face:{x:160,y:130,s:.78} },

  { letter:'I', color:'#2EC4B6', emoji:'🦎', word:'Iguana',
    strokes:[
      'M88 60 L212 60',       // barra de arriba
      'M150 60 L150 340',     // palito vertical
      'M88 340 L212 340'      // barra de abajo
    ],
    face:{x:150,y:205,s:.54} },

  { letter:'O', color:'#FF8A3D', emoji:'🐻', word:'Oso',
    strokes:[
      // una sola vuelta: arranca arriba y gira hacia la izquierda
      'M150 62 C104 62 66 124 66 200 C66 276 104 338 150 338 C196 338 234 276 234 200 C234 124 196 62 150 62'
    ],
    face:{x:150,y:200,s:.92} },

  { letter:'U', color:'#B388EB', emoji:'🍇', word:'Uvas',
    strokes:[
      // un solo trazo: bajo por la izquierda, curva abajo, subo por la derecha
      'M76 62 L76 252 C76 322 224 322 224 252 L224 62'
    ],
    face:{x:150,y:188,s:.88} }
];

/* ---------- parametros de trazado ---------- */
var SAMPLE_STEP = 4;    // se muestrea el path cada 4 unidades del viewBox
var TOL         = 46;   // tolerancia generosa: dedos chiquitos
var LOOKAHEAD   = 14;   // muestras maximas de avance por movimiento: no se puede saltear
var SVG_NS      = 'http://www.w3.org/2000/svg';
var STORE_KEY   = 'tukutoon:vocales:completadas';

/* ---------- estado ---------- */
var svg      = document.getElementById('stage');
var fx       = document.getElementById('fx');
var ctx      = fx.getContext('2d');
var cardEl   = document.getElementById('card');
var promptEl = document.getElementById('prompt');

var vIdx       = 0;     // vocal activa
var strokeIdx  = 0;     // trazo activo dentro de la vocal
var sampleIdx  = 0;     // muestra alcanzada dentro del trazo activo
var drawing    = false;
var locked     = false; // true mientras se festeja / hay tarjeta
var strokeData = [];
var handEl     = null;
var done       = loadDone();
var reduced    = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   AUDIO (WebAudio, sin assets)
   ===================================================================== */
var AC = null;
function audio(){
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(C){ AC = new C(); } }
    if(AC && AC.state === 'suspended'){ AC.resume(); }
  }catch(e){ AC = null; }
  return AC;
}
function pop(freq, dur){
  var a = audio(); if(!a) return;
  try{
    var f = freq || 520, d = dur || .16;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.9, t + d);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.26, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + .02);
  }catch(e){}
}
function fanfare(){
  [523, 659, 784, 1047].forEach(function(f, i){
    setTimeout(function(){ pop(f, .2); }, i * 110);
  });
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = .8; u.pitch = 1.25;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* =====================================================================
   PROGRESO GUARDADO (local, por navegador)
   ===================================================================== */
function loadDone(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveDone(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(done)); }catch(e){}
}

/* =====================================================================
   UI: estrellas y selector de vocales
   ===================================================================== */
function buildStars(){
  var box = document.getElementById('stars');
  box.innerHTML = '';
  VOWELS.forEach(function(v){
    var s = document.createElementNS(SVG_NS, 'svg');
    s.setAttribute('viewBox', '0 0 100 100');
    s.setAttribute('class', 'star' + (done.indexOf(v.letter) >= 0 ? ' on' : ''));
    var p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', 'M50 8 L62 38 L95 40 L69 60 L78 92 L50 74 L22 92 L31 60 L5 40 L38 38 Z');
    s.appendChild(p);
    box.appendChild(s);
  });
}
function buildPicker(){
  var box = document.getElementById('picker');
  box.innerHTML = '';
  VOWELS.forEach(function(v, i){
    var b = document.createElement('button');
    b.className = 'vbtn' + (i === vIdx ? ' sel' : '') + (done.indexOf(v.letter) >= 0 ? ' done' : '');
    b.style.setProperty('--c', v.color);
    b.textContent = v.letter;
    b.setAttribute('aria-label', 'Vocal ' + v.letter);
    // el selector nunca se bloquea: cambiar de vocal siempre es seguro, incluso
    // durante el festejo (si no, queda mudo hasta que aparece la tarjeta)
    b.addEventListener('click', function(){ hideCard(); loadVowel(i); });
    box.appendChild(b);
  });
}
function refreshChrome(){
  buildStars();
  buildPicker();
  cardEl.style.setProperty('--c', VOWELS[vIdx].color);
}

/* =====================================================================
   CONSTRUCCION DE LA LETRA
   ===================================================================== */
function mkPath(d, cls){
  var p = document.createElementNS(SVG_NS, 'path');
  p.setAttribute('d', d);
  p.setAttribute('class', cls);
  return p;
}

function loadVowel(i){
  vIdx = i; strokeIdx = 0; sampleIdx = 0; drawing = false; locked = false;
  var v = VOWELS[vIdx];
  svg.innerHTML = '';
  strokeData = [];

  var gRoot = document.createElementNS(SVG_NS, 'g');
  svg.appendChild(gRoot);

  v.strokes.forEach(function(d, si){
    var g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'stroke-g' + (si === 0 ? ' active' : ''));

    var edge = mkPath(d, 'road-edge');
    var road = mkPath(d, 'road');
    var prog = mkPath(d, 'progress');
    var dash = mkPath(d, 'dashes');
    prog.setAttribute('stroke', v.color);

    g.appendChild(edge); g.appendChild(road); g.appendChild(prog); g.appendChild(dash);
    gRoot.appendChild(g);

    var len = road.getTotalLength();
    var samples = [];
    for(var l = 0; l <= len; l += SAMPLE_STEP){
      var pt = road.getPointAtLength(l);
      samples.push({ x:pt.x, y:pt.y, l:l });
    }
    var last = road.getPointAtLength(len);
    samples.push({ x:last.x, y:last.y, l:len });

    prog.style.strokeDasharray = '0 ' + (len + 10);
    prog.style.display = 'none';   // linecap round pinta un punto con largo 0

    strokeData.push({ g:g, prog:prog, road:road, dash:dash, len:len, samples:samples });
  });

  addArrows();

  // carita
  var f = v.face;
  var face = document.createElementNS(SVG_NS, 'g');
  face.setAttribute('class', 'face');
  face.setAttribute('transform', 'translate(' + f.x + ' ' + f.y + ') scale(' + f.s + ')');
  face.innerHTML =
    '<circle class="cheek" cx="-23" cy="7" r="5.5"/>' +
    '<circle class="cheek" cx="23" cy="7" r="5.5"/>' +
    '<g class="eyes">' +
      '<ellipse cx="-13" cy="-7" rx="4.6" ry="6.4"/>' +
      '<ellipse cx="13" cy="-7" rx="4.6" ry="6.4"/>' +
    '</g>' +
    '<path class="mouth" d="M-11 7 Q0 17 11 7"/>';
  svg.appendChild(face);

  // manita guia
  handEl = document.createElementNS(SVG_NS, 'text');
  handEl.setAttribute('class', 'hand');
  handEl.setAttribute('text-anchor', 'middle');
  handEl.textContent = '👆';
  svg.appendChild(handEl);

  promptEl.textContent = 'Seguí el camino con el dedo';
  refreshChrome();
  startHand();
}

function addArrows(){
  strokeData.forEach(function(s){
    var a = s.road.getPointAtLength(Math.max(0, s.len - 14));
    var b = s.road.getPointAtLength(s.len);
    var ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    var tri = document.createElementNS(SVG_NS, 'path');
    tri.setAttribute('d', 'M-6 -6 L7 0 L-6 6 Z');
    tri.setAttribute('fill', '#fff');
    tri.setAttribute('class', 'arrow');
    tri.setAttribute('opacity', '.95');
    tri.setAttribute('transform', 'translate(' + b.x + ' ' + b.y + ') rotate(' + ang + ')');
    s.g.appendChild(tri);
  });
}

/* =====================================================================
   TRAZADO
   ===================================================================== */
function toSvg(evt){
  var m = svg.getScreenCTM();
  if(!m) return { x:-9999, y:-9999 };
  var pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  var p = pt.matrixTransform(m.inverse());
  return { x:p.x, y:p.y };
}
function dist2(a, b){ var dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }

function paintProgress(){
  var s = strokeData[strokeIdx]; if(!s) return;
  var l = s.samples[sampleIdx].l;
  s.prog.style.display = l > 0 ? '' : 'none';
  s.prog.style.strokeDasharray = l + ' ' + (s.len + 10);
}

function advance(p){
  var s = strokeData[strokeIdx]; if(!s) return;
  var top = Math.min(sampleIdx + LOOKAHEAD, s.samples.length - 1);
  var best = -1, tol2 = TOL * TOL;
  for(var i = sampleIdx; i <= top; i++){
    if(dist2(p, s.samples[i]) <= tol2){ best = i; }  // la mas avanzada dentro de la tolerancia
  }
  if(best > sampleIdx){
    sampleIdx = best;
    paintProgress();
    if(sampleIdx >= s.samples.length - 1){ completeStroke(); }
  }
}

function onDown(e){
  if(locked) return;
  audio();
  var s = strokeData[strokeIdx]; if(!s) return;
  var p = toSvg(e);
  var startTol = TOL * 1.25;
  if(dist2(p, s.samples[sampleIdx]) <= startTol * startTol){
    drawing = true;
    stopHand();
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    advance(p);
  }else{
    promptEl.textContent = 'Empezá desde la manita 👆';
    startHand();
  }
  e.preventDefault();
}
function onMove(e){
  if(!drawing || locked) return;
  advance(toSvg(e));
  e.preventDefault();
}
function onUp(e){
  if(!drawing) return;
  drawing = false;
  try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
  // levantar el dedo NO pierde progreso: la manita vuelve desde donde iba
  if(!locked){ startHand(); }
}

function completeStroke(){
  var s = strokeData[strokeIdx];
  s.prog.style.display = '';
  s.prog.style.strokeDasharray = 'none';
  s.g.classList.remove('active');
  s.g.classList.add('finished');
  s.dash.style.display = 'none';
  var ar = s.g.querySelector('.arrow'); if(ar){ ar.style.display = 'none'; }
  s.road.classList.add('done');
  drawing = false;

  sparkles(s.samples[s.samples.length - 1], VOWELS[vIdx].color);
  pop(660, .18);

  strokeIdx++;
  sampleIdx = 0;

  if(strokeIdx >= strokeData.length){
    completeLetter();
  }else{
    strokeData[strokeIdx].g.classList.add('active');
    promptEl.textContent = 'Ahora este ✨';
    startHand();
  }
}

function completeLetter(){
  locked = true;
  stopHand();
  var v = VOWELS[vIdx];
  if(done.indexOf(v.letter) < 0){ done.push(v.letter); saveDone(); }
  refreshChrome();
  promptEl.textContent = '¡Muy bien! 🎉';
  confetti(v.color);
  fanfare();
  setTimeout(function(){ speak(v.letter); }, 420);
  setTimeout(function(){ speak(v.word); }, 1250);
  setTimeout(showCard, 900);
}

svg.addEventListener('pointerdown', onDown);
svg.addEventListener('pointermove', onMove);
svg.addEventListener('pointerup', onUp);
svg.addEventListener('pointercancel', onUp);

/* =====================================================================
   MANITA GUIA
   ===================================================================== */
var handRAF = null, handT0 = 0;
function startHand(){
  stopHand();
  if(!handEl) return;
  var s = strokeData[strokeIdx]; if(!s) return;
  var from = s.samples[sampleIdx].l, to = s.len;
  var dur  = Math.max(900, (to - from) * 9);   // ms
  handT0 = 0;
  handEl.classList.remove('hide');

  handRAF = requestAnimationFrame(function frame(ts){
    if(!handT0){ handT0 = ts; }
    var t = (ts - handT0) % (dur + 500);
    if(t > dur){
      handEl.classList.add('hide');
    }else{
      handEl.classList.remove('hide');
      var pt = s.road.getPointAtLength(Math.min(from + (to - from) * (t / dur), s.len));
      handEl.setAttribute('x', pt.x);
      handEl.setAttribute('y', pt.y + 34);
    }
    handRAF = requestAnimationFrame(frame);
  });
}
function stopHand(){
  if(handRAF){ cancelAnimationFrame(handRAF); handRAF = null; }
  if(handEl){ handEl.classList.add('hide'); }
}

/* =====================================================================
   PARTICULAS: chispitas por trazo + confeti por vocal
   ===================================================================== */
var parts = [], fxRAF = null;
function sizeFx(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width  = Math.floor(window.innerWidth * dpr);
  fx.height = Math.floor(window.innerHeight * dpr);
  fx.style.width  = window.innerWidth + 'px';
  fx.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeFx();

function svgToScreen(p){
  var m = svg.getScreenCTM();
  if(!m) return { x:window.innerWidth / 2, y:window.innerHeight / 2 };
  var pt = svg.createSVGPoint(); pt.x = p.x; pt.y = p.y;
  var r = pt.matrixTransform(m);
  return { x:r.x, y:r.y };
}

function sparkles(svgPoint, color){
  var o = svgToScreen(svgPoint);
  var n = reduced ? 8 : 18;
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4;
    parts.push({ x:o.x, y:o.y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 1,
                 g:.12, r:2 + Math.random() * 3, life:1, dec:.02 + Math.random() * .02,
                 c:(Math.random() < .5 ? color : '#FFFFFF'), sq:false });
  }
  runFx();
}
function confetti(color){
  var cols = [color, '#FFD84D', '#EF658E', '#2EC4B6', '#FFFFFF', '#B388EB'];
  var n = reduced ? 24 : 90;
  for(var i = 0; i < n; i++){
    parts.push({
      x:Math.random() * window.innerWidth,
      y:-20 - Math.random() * 160,
      vx:(Math.random() - .5) * 2.4,
      vy:2 + Math.random() * 3.4,
      g:.06, r:4 + Math.random() * 5, life:1, dec:.006,
      c:cols[(Math.random() * cols.length) | 0], sq:true,
      rot:Math.random() * 6.28, vr:(Math.random() - .5) * .3
    });
  }
  runFx();
}
function runFx(){
  if(fxRAF) return;
  fxRAF = requestAnimationFrame(function loop(){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for(var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life -= p.dec;
      if(p.rot !== undefined){ p.rot += p.vr; }
      if(p.life <= 0 || p.y > window.innerHeight + 40){ parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c;
      if(p.sq){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5); ctx.restore();
      }else{
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.284); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if(parts.length){
      fxRAF = requestAnimationFrame(loop);
    }else{
      fxRAF = null;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  });
}

/* =====================================================================
   TARJETA DE PALABRA
   ===================================================================== */
function showCard(){
  var v = VOWELS[vIdx];
  cardEl.style.setProperty('--c', v.color);
  document.getElementById('card-emoji').textContent = v.emoji;
  document.getElementById('card-word').innerHTML =
    '<b>' + v.letter + '</b>' + v.word.slice(1).toLowerCase();
  cardEl.classList.add('show');
}
function hideCard(){ cardEl.classList.remove('show'); }

document.getElementById('btn-again').addEventListener('click', function(e){
  e.stopPropagation(); hideCard(); loadVowel(vIdx);
});
document.getElementById('btn-next').addEventListener('click', function(e){
  e.stopPropagation(); hideCard(); loadVowel((vIdx + 1) % VOWELS.length);
});
cardEl.addEventListener('click', function(e){
  if(e.target === cardEl){ hideCard(); loadVowel((vIdx + 1) % VOWELS.length); }
});
document.getElementById('reset-btn').addEventListener('click', function(){
  hideCard(); loadVowel(vIdx);
});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
window.addEventListener('resize', function(){
  sizeFx();
  if(!locked && !drawing){ startHand(); }
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

loadVowel(0);

})();
