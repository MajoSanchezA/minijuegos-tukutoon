<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TukuToon · Traza las vocales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comfortaa:wght@400;700&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="motor/motor-trazos.css">
</head>
<body>

<script src="vocales.js"></script>
<script src="motor/motor-trazos.js"></script>
<script>
  // Que vocal mostrar sale de la URL: menu.html enlaza a ?vocal=A, ?vocal=E...
  // Sin el parametro, la pagina cae al modo viejo — las cinco con el selector
  // de abajo — que sigue sirviendo para probar todo de una.
  var pedida = (location.search.match(/[?&]vocal=([AEIOUaeiou])/) || [])[1];

  TukuToonTracePage({
    letras: VOCALES,
    vocal: pedida || null,
    menuHref: 'menu.html',
    titulo: 'TukuToon',
    subtitulo: pedida ? 'LA VOCAL ' + pedida.toUpperCase() : 'TRAZA LAS VOCALES'
    // tolerancia: 150   // subir si cuesta con dedos chicos
  });
</script>

</body>
</html>
