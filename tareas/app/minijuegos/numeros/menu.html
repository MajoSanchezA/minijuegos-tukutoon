<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TukuToon · Los números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comfortaa:wght@400;700&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  /* 100dvh, nunca 100vh: el chrome dinamico del navegador movil corta la pantalla */
  height:100vh; height:100dvh;
  font-family:'Comfortaa',system-ui,-apple-system,sans-serif;
  color:#2B2140;
  /* el celeste de las paredes del aula, por si la ilustracion tarda en cargar */
  background:#2E9BB8;
  overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
  user-select:none; -webkit-user-select:none;
}

/* ---------- encabezado ---------- */
header{
  position:relative;z-index:3;flex:0 0 auto;text-align:center;
  padding:clamp(8px,2.4vh,20px) 16px clamp(4px,1vh,8px);
}
h1{
  font-family:'Fredoka',sans-serif;font-weight:600;color:#fff;
  font-size:clamp(18px,5vw,30px);margin:0;line-height:1.1;
  text-shadow:0 2px 0 rgba(0,0,0,.14);
}
h1 small{
  display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;
  font-size:.46em;opacity:.85;letter-spacing:.06em;margin-top:2px;
}

/* ---------- el aula ---------- */
.aula{position:fixed;inset:0;z-index:0;overflow:hidden}
/* Relleno: la misma ilustracion, borrosa y a pantalla completa. Solo asoma
   en pantallas mas angostas que la escena (el celular parado), donde un
   16:9 no llega a cubrir sin comerse el pizarron por los costados. */
.aula::before{
  content:'';position:absolute;inset:0;
  background:url(../vocales/fondo-menu.png) center/cover no-repeat;
  filter:blur(26px) brightness(.62) saturate(.9);transform:scale(1.12);
}
/* Velo arriba y abajo: el titulo y el pie caen sobre el dibujo y sin esto
   el blanco se pierde contra el techo claro del aula. */
.aula::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(18,26,40,.34) 0%,rgba(18,26,40,0) 17%,
                             rgba(18,26,40,0) 83%,rgba(18,26,40,.3) 100%);
}
.escena{
  /* Proporcion fija 16:9, la del PNG: las cifras van posicionadas en
     porcentajes sobre el pizarron que ya trae dibujado la ilustracion, asi
     que la caja tiene que conservar la forma de la foto o se desalinean.
     Se agranda hasta tapar la pantalla, pero nunca mas de 145vw: pasado
     ese punto el pizarron se empieza a ir de la pantalla por los costados. */
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  aspect-ratio:16/9;
  width:min(max(100vw, calc(100dvh * 16 / 9)), 145vw);
}
.escena .foto{
  position:absolute;inset:0;display:block;
  width:100%;height:100%;object-fit:cover;
}

/* ---------- el pizarron ---------- */
/* Caja invisible: es el rectangulo verde de la ilustracion, medido sobre el
   PNG (x 18.1%-82.5%, y 24.5%-88.1%) y metido un pelin hacia adentro para que
   ninguna cifra se apoye en el marco naranja. */
.pizarron{position:absolute;left:19%;top:26%;width:62%;height:60%}

/* ---------- cada cifra, suelta sobre el pizarron ---------- */
.cifra{
  position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;color:inherit;cursor:pointer;touch-action:manipulation;
  transition:transform .14s;
}
.cifra:active{transform:scale(.93) rotate(0deg) !important}
.cifra:focus-visible{outline:4px solid #FFD84D;outline-offset:6px;border-radius:14px}
.cifra img{display:block;width:78%;height:auto;aspect-ratio:1;object-fit:contain}
/* Sobre el verde del pizarron el contorno ocre del arte original se pierde:
   la letra que todavia falta se pinta de blanco, como tiza. La que ya esta
   hecha va a color, con una sombra que la despega del verde. */
.cifra img.pendiente{filter:brightness(0) invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.35));opacity:.92}
.cifra img.hecha{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cifra .palabra{
  /* pastilla del color del numero: contra el verde, el texto suelto a color
     no se leia (el rojo y el violeta se apagan contra el fondo) */
  font-family:'Fredoka',sans-serif;font-weight:600;color:#2B2140;
  font-size:clamp(9px,1.25vw,16px);white-space:nowrap;
  display:flex;align-items:center;gap:3px;margin-top:-6%;
  background:var(--c);border-radius:999px;
  padding:1px clamp(5px,.8vw,9px);
  box-shadow:0 2px 0 rgba(0,0,0,.2);
}
.cifra .estrellas{
  position:absolute;top:-6%;right:-2%;font-size:clamp(10px,1.5vw,20px);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
}

/* Dos filas de cinco, cada una con su leve inclinacion, como numeros
   magneticos pegados en el pizarron por una mano de tres anos. Son diez y no
   cinco, asi que no entran sueltos como las vocales: van en grilla, pero
   apenas desparejos para que no parezca una planilla. La fila de abajo
   arranca un poco mas a la izquierda: la esquina de abajo a la derecha queda
   libre a proposito, ahi entra el puntero de la maestra de la ilustracion. */
.n-0{left:1%;  top:0%;  width:18%; transform:rotate(-3deg)}
.n-1{left:21%; top:4%;  width:18%; transform:rotate(2deg)}
.n-2{left:41%; top:0%;  width:18%; transform:rotate(-2deg)}
.n-3{left:61%; top:4%;  width:18%; transform:rotate(3deg)}
.n-4{left:81%; top:0%;  width:18%; transform:rotate(-1deg)}
.n-5{left:-1%; top:50%; width:17%; transform:rotate(2deg)}
.n-6{left:16%; top:54%; width:17%; transform:rotate(-3deg)}
.n-7{left:33%; top:50%; width:17%; transform:rotate(1deg)}
.n-8{left:50%; top:54%; width:17%; transform:rotate(-2deg)}
.n-9{left:67%; top:50%; width:17%; transform:rotate(3deg)}

/* ---------- pie ---------- */
footer{
  position:relative;z-index:3;flex:0 0 auto;text-align:center;
  padding:clamp(8px,1.6vh,14px) 16px max(8px,env(safe-area-inset-bottom));
}
.reinicio{
  border:none;background:rgba(255,255,255,.22);color:#fff;
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.04em;border-radius:20px;padding:7px 16px;cursor:pointer;
  touch-action:manipulation;
}
.reinicio:active{background:rgba(255,255,255,.32)}

/* Celular acostado: queda poco alto y el titulo y el pie se comen el
   pizarron. Se achican los dos para que no lo tapen. */
@media (orientation:landscape) and (max-height:520px){
  header{padding:5px 12px 2px}
  h1{font-size:clamp(15px,3.6vh,22px)}
  footer{padding:5px 12px max(5px,env(safe-area-inset-bottom))}
  .reinicio{font-size:11px;padding:5px 13px}
}

@media (prefers-reduced-motion:reduce){
  .cifra{transition:none}
}
</style>
</head>
<body>

<div class="aula">
  <div class="escena">
    <img class="foto" src="../vocales/fondo-menu.png" alt="" aria-hidden="true">
    <div class="pizarron" id="pizarron"></div>
  </div>
</div>

<header>
  <h1>Los números<small>ELEGÍ UNO PARA TRAZARLO</small></h1>
</header>

<footer><button class="reinicio" id="reinicio">Empezar de nuevo</button></footer>

<script src="numeros.js"></script>
<script>
(function(){
'use strict';

var STORE_KEY = 'tukutoon:numeros:completados';

function hechas(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    var a = raw ? JSON.parse(raw) : [];
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}

function pintar(){
  var listas = hechas();
  var box = document.getElementById('pizarron');
  box.innerHTML = '';

  NUMEROS.forEach(function(v){
    var n = v.letter, hecho = listas.indexOf(n) >= 0, F = v.mayus;

    var a = document.createElement('a');
    a.className = 'cifra n-' + n;
    a.href = 'trazos-numeros-tukutoon.html?numero=' + n;
    a.style.setProperty('--c', v.color);
    a.setAttribute('aria-label',
      'N\u00famero ' + n + ', ' + v.word + (hecho ? '. Completo' : ''));

    // A color si ya lo hizo, en contorno si no — asi el pizarron es tambien
    // el mapa de lo que lleva hecho.
    // .pendiente pinta la imagen de blanco, como tiza. Solo vale para el
    // contorno: si una cifra no lo tuviera y cayera al arte a color, el
    // filtro la dejaria como una mancha blanca.
    var hueca = !hecho && !!F.contorno;
    var img = document.createElement('img');
    img.src = hueca ? F.contorno : F.arte;
    img.className = hueca ? 'pendiente' : 'hecha';
    img.alt = n;
    a.appendChild(img);

    var p = document.createElement('div');
    p.className = 'palabra';
    p.innerHTML = '<span>' + v.emoji + '</span>' + v.word;
    a.appendChild(p);

    if(hecho){
      var e = document.createElement('div');
      e.className = 'estrellas';
      e.textContent = '\u2b50';
      a.appendChild(e);
    }

    box.appendChild(a);
  });
}

document.getElementById('reinicio').addEventListener('click', function(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  pintar();
});

// al volver del juego (incluso desde el cache de atras) se repinta el progreso
window.addEventListener('pageshow', pintar);
pintar();

})();
</script>

</body>
</html>
